dependencies:
  idf:
    version: '>=4.4'
description: '这是一个通用的vfs驱动模型和dts抽象设备树和os抽象插件 (ESP-IDF 组件线: lib 仅含 etl, RTOS 走 IDF
  内置 FreeRTOS)'
files:
  exclude:
  - build/**
  - dist/**
  - .venv/**
  - .cache/**
  - compile_commands.json
  - .config*
  - .git/**
  - esp-component.sh
  - .component_hash
  - CHECKSUMS.json
  - lib/freeRTOS/**
  - lib/rtthread/**
  - lib/mini-os/**
  - lib/threadx/**
  - lib/uC-*/**
  - lib/cjson/**
  - lib/cmsis_dsp/**
  - lib/corehttp/**
  - lib/coremqtt/**
  - lib/easyflash/**
  - lib/easylogger/**
  - lib/fatfs/**
  - lib/flashdb/**
  - lib/freemodbus/**
  - lib/libmodbus/**
  - lib/littlefs/**
  - lib/lvgl/**
  - lib/lwip/**
  - lib/mbedtls/**
  - lib/mcuboot/**
  - lib/miniz/**
  - lib/multibutton/**
  - lib/nanopb/**
  - lib/sfud/**
  - lib/tinyusb/**
  - lib/u8g2/**
  - '**/__pycache__/**'
  - '**/*.pyc'
url: https://github.com/H-000-H/mini_tree
version: 1.4.7
